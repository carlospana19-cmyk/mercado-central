<!-- COMPONENTE NAVBAR - Extraído para reutilización -->
<!-- Este archivo debe ser inyectado dinámicamente en todas las páginas -->
<!-- Uso: fetch('navbar-component.html').then(r => r.text()).then(html => document.getElementById('navbar-container').innerHTML = html) -->

<nav class="navbar-moderno">
    <div class="logo-container">
        <a href="index.html" class="logo-link" aria-label="Mercados Central">
            <img src="logo-mercado-central.png" alt="" class="logo-img">
            <span class="logo-text"><span class="mc-wordmark" role="img" aria-label="Mercados Central"><span class="logo-brand">Mercados</span> Central</span></span>
        </a>
    </div>
    <div class="nav-search">
        <button type="button" class="nav-search-close" aria-label="Cerrar búsqueda"><i class="fas fa-times"></i></button>
        <div class="search-field">
            <input type="text" id="mainSearchInput" placeholder="¿Qué buscas? Ej: propiedades, autos, servicios" autocomplete="off">
        </div>
        <button class="btn-search-hero" aria-label="Buscar"><i class="fas fa-search"></i></button>
        <div id="search-suggest" class="search-suggest"></div>
    </div>
    <div class="buttons-nav">
        <button type="button" id="btn-search-toggle" class="nav-search-toggle" aria-label="Buscar" aria-expanded="false"><i class="fas fa-search"></i></button>
        <!-- Panel de menú: en escritorio es transparente (display:contents) y los botones se ven como siempre;
             en móvil (<768px) es el drawer que abre la hamburguesa. -->
        <div id="nav-menu-panel" class="nav-menu-panel">
            <div class="nav-menu-header">
                <span class="nav-menu-title">Menú</span>
                <button type="button" class="nav-menu-close" aria-label="Cerrar menú"><i class="fas fa-times"></i></button>
            </div>
            <div class="nav-menu-items">
                <button id="btn-dashboard" class="nav-btn-user nav-icon-btn nav-menu-item" style="display: none;" onclick="window.location.href='panel-unificado.html'" title="Mi Panel">
                    <i class="fas fa-user"></i>
                    <span class="nav-menu-label">Mi perfil</span>
                    <span id="profile-message-badge" class="nav-badge" aria-live="polite" style="display: none;"></span>
                </button>
                <button id="btn-logout" class="nav-btn-user nav-menu-item" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
                <button id="btn-login" class="nav-btn-guest nav-menu-item" onclick="window.location.href='login.html'">
                    <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                </button>
            </div>
            <!-- Espacio reservado para futuros selectores (solo se muestra si un slot tiene contenido) -->
            <div class="nav-menu-selectors">
                <div class="nav-menu-slot" id="nav-slot-language" data-slot="language"></div>
                <div class="nav-menu-slot" id="nav-slot-country" data-slot="country"></div>
            </div>
        </div>
        <button id="btn-publish-logged-in" class="nav-btn-user" style="display: none;" onclick="window.location.href='publicar.html'" aria-label="Publicar anuncio">
            <i class="fas fa-plus"></i> Publicar anuncio
        </button>
        <button type="button" id="btn-menu-toggle" class="nav-menu-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-menu-panel"><i class="fas fa-bars"></i></button>
        <div class="nav-menu-overlay"></div>
    </div>
</nav>
