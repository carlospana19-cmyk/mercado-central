<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="connect-src *; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; frame-src 'self' https://wa.me; child-src 'self' https://wa.me;">
  <title>Resultados de búsqueda | Mercados Central</title>
  <meta name="description" content="Explora anuncios clasificados en Panamá: bienes raíces, vehículos, tecnología, hogar y más. Filtra por categoría, precio y ubicación.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

   <!-- CSS NUEVO (Fase 2) — los viejos style/cards.css NO se borran todavía -->
   <link rel="stylesheet" href="mc-base.css?v=14">
  <link rel="stylesheet" href="mc-results.css?v=5">
</head>
<body>
    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <main class="results-page">

        <!-- ENCABEZADO DE RESULTADOS (reemplaza al hero OPEN SHOP) -->
        <div class="results-page-head">
            <h1 id="section-page-title">Resultados</h1>
            <div id="results-summary"><p>Cargando resultados…</p></div>
        </div>

        <div class="results-layout">

            <!-- Interruptor de filtros en móvil (sin JS: checkbox hack) -->
            <input type="checkbox" id="filters-toggle" class="filters-toggle-check" hidden>
            <label for="filters-toggle" class="filters-toggle-btn"><i class="fas fa-sliders-h"></i> Filtros</label>

            <!-- === SIDEBAR DE FILTROS === -->
            <aside id="filters-sidebar" class="filters-sidebar">
                <h3>Filtrar resultados</h3>

                <div class="filter-group">
                    <label id="category-filter-label">Categoría</label>
                    <div id="subcategory-filter-container">
                        <p>Cargando…</p>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="price-min">Precio mínimo (B/.)</label>
                    <input type="number" id="price-min" placeholder="0" min="0">
                </div>

                <div class="filter-group">
                    <label for="price-max">Precio máximo (B/.)</label>
                    <input type="number" id="price-max" placeholder="Cualquiera" min="0">
                </div>

                <button id="apply-filters-btn" class="btn-apply-filters">Aplicar filtros</button>
            </aside>

            <!-- === RESULTADOS === -->
            <div class="results-content">

                <div class="results-toolbar">
                    <div class="sort-control">
                        <label for="sort-select">Ordenar:</label>
                        <select id="sort-select">
                            <option value="recent">Más recientes</option>
                            <option value="price-asc">Menor precio</option>
                            <option value="price-desc">Mayor precio</option>
                        </select>
                    </div>
                </div>

                <div id="results-container" class="box-container results-grid">
                    <!-- Los resultados se insertan aquí con JavaScript -->
                </div>

                <div id="pagination-controls" class="pagination-controls"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <!-- Scripts (mismos, mismo orden) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <script type="module" src="main.js" defer></script>
    <script type="module" src="results-logic.js" defer></script>
    <script type="module" src="navbar-logic.js"></script>
    <script src="load-components.js" defer></script>

    <!-- SVG defs para badges metálicos (los usa el JS — no borrar) -->
    <svg style="display: none;">
      <defs>
        <radialGradient id="shine" cx="50%" cy="35%" r="75%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
          <stop offset="60%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>
        <linearGradient id="rimGloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
          <stop offset="50%" stop-color="rgba(255,255,255,0.2)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
        </linearGradient>
        <path id="star" d="M0,-8 L2.4,-2.6 L8, -2.6 L3.2,0.9 L5.0,6.4 L0,3.2 L-5.0,6.4 L-3.2,0.9 L-8,-2.6 L-2.4,-2.6 Z"/>
      </defs>
    </svg>
    <script type="module" src="search-global.js"></script>
</body>
</html>
