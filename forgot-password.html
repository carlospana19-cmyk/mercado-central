<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="connect-src *; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; frame-src 'self' https://wa.me; child-src 'self' https://wa.me;">
  <title>Recuperar Contraseña - Mercados Central</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="mc-base.css?v=13">
  <link rel="stylesheet" href="mc-auth.css?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body id="pagina-login">

  <div id="navbar-container"></div>

  <div class="login-center-container">
    <main class="auth-main">
      <div class="form-box">
        <img src="logo-mercado-central.jpg" alt="Mercados Central" class="auth-logo">
        <h2>Recuperar Contraseña</h2>
        <p style="color: var(--ink-500); font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center;">Ingresa tu correo electrónico y te enviaremos un enlace para resetear tu contraseña.</p>

        <form id="forgot-password-form">
          <input type="email" id="email-forgot" name="email" placeholder="Correo electrónico" autocomplete="email" required>
          <button type="submit">Enviar Enlace de Recuperación</button>
        </form>

        <p style="margin-top: 1rem; text-align: center;">
          <a href="login.html" style="font-weight: 600;">Volver al login</a>
        </p>
      </div>
    </main>
  </div>

  <!-- FOOTER (componente dinámico) -->
  <div id="footer-container"></div>

  <script type="module" src="main.js"></script>
  <script type="module" src="navbar-logic.js"></script>
  <script src="load-components.js" defer></script>
    <script type="module" src="search-global.js"></script>
</body>
</html>
