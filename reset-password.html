<body id="pagina-login">

  <!-- NAVBAR MODERNO -->
      <!-- NAVBAR (componente dinámico) -->
    <div id="navbar-container"></div>
    
   

  <div class="login-center-container">
    <main class="auth-main">
      <div class="form-box">
        <h2>Crear Nueva Contraseña</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">Ingresa tu nueva contraseña.</p>
        
        <form id="reset-password-form">
          <input type="password" id="password-reset" name="password" placeholder="Nueva contraseña" autocomplete="new-password" required>
          <input type="password" id="password-confirm" name="confirm-password" placeholder="Confirmar contraseña" autocomplete="new-password" required>
          <button type="submit">Cambiar Contraseña</button>
        </form>
        
        <p style="margin-top: 1rem;">
          <a href="login.html" style="color: #00bfae; text-decoration: none; font-weight: 600;">Volver al login</a>
        </p>
      </div>
    </main>
  </div>

  <!-- FOOTER (componente compartido con enlaces oficiales de REDES_SOCIALES) -->
  <div id="footer-container"></div>

  <script type="module" src="main.js"></script>
<script type="module" src="navbar-logic.js"></script>
<script src="load-components.js" defer></script>
    <script type="module" src="search-global.js"></script>
