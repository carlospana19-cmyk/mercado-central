name: mercadocentral_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.1.5
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.4.0
  image_picker: ^1.2.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.jpg"
  # Configuración especial obligatoria para celulares modernos (Android 12+)
  android_12:
    image: "assets/images/logo.jpg"
    color: "#FFFFFF"
