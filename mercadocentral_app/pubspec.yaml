name: mercadocentral_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.1.5
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.4.0
  image_picker: ^1.2.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.2.6
  http: ^1.6.0
  google_maps_flutter: ^2.14.2
  geocoding: ^5.0.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  share_plus: ^11.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-mercado-central.jpeg
    - assets/images/google_g.svg
    - assets/images/categorias/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/splash/splash.png"
  # Configuración especial obligatoria para celulares modernos (Android 12+)
  android_12:
    image: "assets/splash/splash-android12.png"
    color: "#FFFFFF"
