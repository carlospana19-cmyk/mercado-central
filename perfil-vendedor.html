<body>
    <!-- NAVBAR -->
    <div id="navbar-container"></div>

    <main class="perfil-page">

        <a href="resultados.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver a anuncios</a>

        <div class="perfil-layout">

            <!-- COLUMNA IZQUIERDA: tarjeta del vendedor (sticky en desktop) -->
            <aside class="perfil-side">
                <div class="perfil-card" id="perfil-card">
                    <div class="perfil-avatar" id="perfil-avatar">C…</div>
                    <h1 class="perfil-nombre" id="perfil-nombre">Cargando…</h1>
                    <p class="perfil-sub">Vendedor en MercadosCentral</p>
                    <p class="perfil-desde" id="perfil-desde" style="display:none"></p>
                    <p class="perfil-count" id="perfil-count">…</p>

                    <div class="perfil-contacto">
                        <a class="btn-contact-wa" id="whatsapp-link" style="display:none">
                            <i class="fab fa-whatsapp"></i> Chat por WhatsApp
                        </a>
                        <a class="btn-secondary-contact" id="phone-link" style="display:none">
                            <i class="fas fa-phone-alt"></i> Llamar
                        </a>
                    </div>
                </div>
            </aside>

            <!-- COLUMNA DERECHA: sus anuncios -->
            <div class="perfil-main">
                <h2 class="perfil-seccion-titulo" id="perfil-anuncios-titulo">Anuncios</h2>
                <div id="perfil-anuncios" class="box-container results-grid"></div>

                <div id="perfil-vacio" class="perfil-vacio" style="display:none">
                    <p>Este vendedor aún tiene publicaciones activas.</p>
                    <a href="index.html" class="btn-explorar">Explorar anuncios</a>
                </div>

                <button id="perfil-cargar-mas" class="btn-cargar-mas" style="display:none">Cargar más</button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div id="footer-container"></div>

    <!-- Scripts (mismo orden que resultados.html) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <script type="module" src="main.js" defer></script>
    <script type="module" src="perfil-vendedor-logic.js" defer></script>
    <script type="module" src="navbar-logic.js"></script>
    <script src="load-components.js" defer></script>
    <script type="module" src="search-global.js"></script>
